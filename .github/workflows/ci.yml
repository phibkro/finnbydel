name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - run: bun install --cwd app --frozen-lockfile
      - run: bun install --cwd server --frozen-lockfile
      - run: bun run check

  # Production deploy after every merge to main (a person's or Renovate's), once the checks above pass.
  # Off until the repository variable DEPLOYMENTS is `enabled`, so merging this before the secrets exist stays green.
  # Alchemy reads Cloudflare credentials from the environment in CI (CI=true) and keeps state in Cloudflare.state().
  deploy:
    needs: [check]
    if: vars.DEPLOYMENTS == 'enabled' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
      - run: bun install --cwd app --frozen-lockfile
      - run: bun install --cwd server --frozen-lockfile
      - name: Deploy
        run: bun run deploy --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
